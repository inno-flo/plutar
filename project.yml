name: Plutar
options:
  bundleIdPrefix: com.innoflo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: fr

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.9"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Plutar:
    type: application
    platform: iOS
    deploymentTarget: "26.6"
    sources:
      - path: Plutar
    info:
      path: Plutar/Info.plist
      properties:
        # Without this, xcodegen hardcodes 1.0 here and MARKETING_VERSION
        # never reaches the bundle.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Plutar
        UILaunchScreen: {}
        UIStatusBarHidden: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.innoflo.plutar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        # Added in Xcode and previously only present in the generated
        # project — regenerating used to wipe them.
        DEVELOPMENT_TEAM: AQ24F2W59K
        INFOPLIST_KEY_CFBundleDisplayName: Plutar
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
