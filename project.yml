name: Plutar
options:
  bundleIdPrefix: com.innoflo
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: fr

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Plutar:
    type: application
    platform: iOS
    deploymentTarget: "26.6"
    sources:
      - path: Plutar
        excludes:
          # macOS-only screens — see the PlutarMac target below, which adds
          # this same folder explicitly to its own sources instead.
          - "Views/macOS/**"
    info:
      path: Plutar/Info.plist
      properties:
        # Without this, xcodegen hardcodes 1.0 here and MARKETING_VERSION
        # never reaches the bundle.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Plutar
        UILaunchScreen: {}
        UIStatusBarHidden: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: Plutar/Plutar.entitlements
      properties:
        # &appGroupID/&cloudKitContainerID anchor the one spelling of each
        # id in the whole file — every other target below references it via
        # *appGroupID/*cloudKitContainerID instead of retyping the literal,
        # so a rename only has to happen here. `SharedStore.cloudKitContainerID`
        # (Swift) must still be kept in sync with the value anchored here —
        # YAML anchors can't reach across into Swift source.
        com.apple.security.application-groups:
          - &appGroupID group.com.innoflo.plutar
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - &cloudKitContainerID iCloud.com.innoflo.plutar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.innoflo.plutar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        # Added in Xcode and previously only present in the generated
        # project — regenerating used to wipe them.
        DEVELOPMENT_TEAM: AQ24F2W59K
        INFOPLIST_KEY_CFBundleDisplayName: Plutar
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - target: PlutarShare
        embed: true

  PlutarMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: PlutarMac
      - path: Plutar/Models
      - path: Plutar/Persistence
      - path: Plutar/ViewModels
      - path: Plutar/Views/Rows/LinkRowView.swift
      - path: Plutar/Views/EmptyStateView.swift
      - path: Plutar/Views/SettingsSections.swift
      - path: Plutar/Views/macOS
    info:
      path: PlutarMac/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Plutar
        NSHumanReadableCopyright: "© Innoflo"
        LSApplicationCategoryType: public.app-category.utilities
    entitlements:
      path: PlutarMac/PlutarMac.entitlements
      properties:
        com.apple.security.application-groups:
          - *appGroupID
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - *cloudKitContainerID
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.innoflo.plutar.mac
        SWIFT_EMIT_LOC_STRINGS: YES
        DEVELOPMENT_TEAM: AQ24F2W59K
        INFOPLIST_KEY_CFBundleDisplayName: Plutar
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        SUPPORTED_PLATFORMS: "macosx"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
    dependencies:
      - target: PlutarShareMac
        embed: true

  PlutarShareMac:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: PlutarShareMac
      # Shared with PlutarShare (iOS) — same App Group container and
      # LinkItem-building logic, plus the platform-agnostic
      # SharedLinkExtraction and the shared ShareView UI. See the comments
      # atop SharedStore.swift and SharedLinkExtraction.swift.
      - path: Plutar/Models/LinkItem.swift
      - path: Plutar/Models/SourceRank.swift
      - path: Plutar/Persistence
      - path: Plutar/Views/ShareView.swift
    info:
      path: PlutarShareMac/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Plutar
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            # Same predicate as PlutarShare (iOS) — matches either a real
            # URL attachment or a plain-text one (several apps hand the
            # share sheet a text attachment containing the link instead of
            # a proper URL). ShareViewController still rejects plain text
            # that isn't actually a URL once asked to load it.
            NSExtensionActivationRule: 'SUBQUERY (extensionItems, $extensionItem, SUBQUERY ($extensionItem.attachments, $attachment, (ANY $attachment.registeredTypeIdentifiers UTI-conforms-to "public.url") || (ANY $attachment.registeredTypeIdentifiers UTI-conforms-to "public.plain-text")).@count >= 1).@count >= 1'
    entitlements:
      path: PlutarShareMac/PlutarShareMac.entitlements
      properties:
        com.apple.security.application-groups:
          - *appGroupID
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - *cloudKitContainerID
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.innoflo.plutar.mac.PlutarShareMac
        SWIFT_EMIT_LOC_STRINGS: YES
        DEVELOPMENT_TEAM: AQ24F2W59K
        INFOPLIST_KEY_CFBundleDisplayName: Plutar
        SUPPORTED_PLATFORMS: "macosx"
        MACOSX_DEPLOYMENT_TARGET: "26.0"

  PlutarShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.6"
    sources:
      - path: PlutarShare
      # Shared with the main app so both link to the exact same App
      # Group container and LinkItem-building logic — see the comment
      # atop SharedStore.swift.
      - path: Plutar/Models/LinkItem.swift
      - path: Plutar/Models/SourceRank.swift
      - path: Plutar/Persistence
      - path: Plutar/Views/ShareView.swift
    info:
      path: PlutarShare/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Plutar
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          # Safari-only: only Safari runs this before invoking the
          # extension (see ShareViewController.extractSharedURL and
          # SharePreprocessor.js) — it's how a Safari share gets tagged
          # "via Safari" instead of the generic "via Partage" fallback.
          NSExtensionJavaScriptPreprocessingFile: SharePreprocessor
          NSExtensionAttributes:
            # The simplified dictionary form (Supports*WithMaxCount) only
            # matches items typed exactly as public.url — several non-Apple
            # apps (X, Mastodon, Reddit…) hand the share sheet a plain-text
            # attachment containing the link instead, which that form can't
            # accept without also accepting arbitrary text. This predicate
            # form matches either shape; ShareViewController still rejects
            # plain text that isn't actually a URL once it's asked to load it.
            NSExtensionActivationRule: 'SUBQUERY (extensionItems, $extensionItem, SUBQUERY ($extensionItem.attachments, $attachment, (ANY $attachment.registeredTypeIdentifiers UTI-conforms-to "public.url") || (ANY $attachment.registeredTypeIdentifiers UTI-conforms-to "public.plain-text")).@count >= 1).@count >= 1'
    entitlements:
      path: PlutarShare/PlutarShare.entitlements
      properties:
        com.apple.security.application-groups:
          - *appGroupID
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - *cloudKitContainerID
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.innoflo.plutar.PlutarShare
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        DEVELOPMENT_TEAM: AQ24F2W59K
        INFOPLIST_KEY_CFBundleDisplayName: Plutar
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
